[package]
name = "uf-spectra-photon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Photon transport for Spectra: publish sink and batched consumer-group storage writer"
repository.workspace = true
documentation = "https://docs.rs/uf-spectra-photon"
readme = "README.md"

[lib]
name = "spectra_photon"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# The package is renamed back to `photon` because `#[photon::topic]` expands to `photon::` paths.
photon = { package = "uf-photon", version = "0.1.4", features = ["runtime", "mem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spectra-core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
parking_lot = { workspace = true }
spectra-backend-mem = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
